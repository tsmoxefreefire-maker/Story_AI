<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<style>{{style}}</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap"><div id="stage" role="img" aria-label="{{title}}"><div id="camera">{{scenes}}</div></div></div>
  <div id="captions" aria-live="polite"></div>
  <div id="controls">
    <button type="button" id="btn-play" class="ctl" data-label="pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic-play" d="M7 4.5v15l12.5-7.5z"/><path class="ic-pause" d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/></svg></button>
    <button type="button" id="btn-restart" class="ctl" data-label="restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5a7.5 7.5 0 1 1-7.2 9.6l2.2-.6A5.2 5.2 0 1 0 12 6.8v3.1L7.4 5.7 12 1.5z"/></svg></button>
    <div id="progress" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div><div id="progress-ticks"></div></div>
    <button type="button" id="btn-speed" class="ctl" data-label="speed"><span>1×</span></button>
    <button type="button" id="btn-cc" class="ctl" data-label="captions" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18v13H3zM6 10.2h5v1.8H6zm7 0h5v1.8h-5zm-7 3.5h8v1.8H6zm10 0h2v1.8h-2z" fill-rule="evenodd"/></svg></button>
  </div>
  <div id="overlay" hidden></div>
  <div id="start"><div class="start-card"><h1 id="start-title">{{title}}</h1><button type="button" id="btn-start" class="big"></button></div></div>
  <div id="end" hidden><div class="start-card"><h1>{{title}}</h1><button type="button" id="btn-replay" class="big"></button></div></div>
  <div id="rotate" hidden><span></span><button type="button" class="ctl" id="btn-rotate-x" aria-label="×">×</button></div>
</div>
<script type="application/json" id="story-data">{{story_data}}</script>
<script>{{player}}</script>
</body>
</html>
