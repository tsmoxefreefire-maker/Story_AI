    <rect x="1133" y="400" width="20" height="180" rx="10" fill="var(--c-neutral-2)"/>
    <circle cx="1143" cy="372" r="70" fill="var(--ground-d)"/><circle cx="1196" cy="404" r="44" fill="var(--ground-d)"/>
