<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-label="Sports field with a goal and stands" data-kind="outdoor" data-ground-y="640" data-supports="day evening night" data-slots="260,640 640,640 1020,640">
  <defs><linearGradient id="sf-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky-d)" stop-opacity="0.75"/><stop offset="0.8" stop-color="var(--sky-d)" stop-opacity="0"/></linearGradient><linearGradient id="sportsfield-haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky)" stop-opacity="0"/><stop offset="1" stop-color="var(--sky)" stop-opacity="0.38"/></linearGradient><linearGradient id="sportsfield-sunlit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--paper)" stop-opacity="0.22"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0.06"/></linearGradient><linearGradient id="sportsfield-edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ink)" stop-opacity="0"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0.14"/></linearGradient></defs>
  <g class="layer-far">
