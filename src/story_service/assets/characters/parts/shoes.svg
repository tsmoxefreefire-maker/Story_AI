  </g>
  <g data-variant="school_shoes" data-color="ink">
    <path d="M73 378 Q74 371 84 371 L92 372 Q102 374 102 382 L102 387 Q102 391 97 391 L76 391 Q72 391 72 387 Z" fill="var(--shoe)"/>
    <rect x="72" y="387" width="30" height="4" rx="2" fill="var(--shoe-d)"/>
  </g>
  <g data-variant="sandals" data-color="c-neutral-2">
    <ellipse cx="87" cy="383" rx="13" ry="5" fill="var(--skin)"/>
    <rect x="72" y="386" width="30" height="5" rx="2.5" fill="var(--shoe-d)"/>
