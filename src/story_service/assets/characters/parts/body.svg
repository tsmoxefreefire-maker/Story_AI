<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Character kit, local box 200x400, feet on y=390, facing right. Light from the top left: one darker shade (-d).
       Slots: neck, head, torso-shade, legs, arms. Colors are the per-actor variables (Section 6.3). -->
  <g data-slot="neck"><rect x="91" y="104" width="18" height="34" rx="6" fill="var(--skin-d)"/></g>
  <g data-slot="head">
    <ellipse cx="67" cy="84" rx="6" ry="8" fill="var(--skin-d)"/>
    <ellipse cx="133" cy="84" rx="6" ry="8" fill="var(--skin-d)"/>
    <ellipse cx="100" cy="78" rx="33" ry="37" fill="var(--skin)"/>
  </g>
  <!-- legs: one shape per leg; its fill depends on the bottom (trousers = bottom color, otherwise skin) -->
  <g data-slot="leg-l"><rect x="76" y="244" width="16" height="140" rx="8" fill="var(--leg)"/></g>
  <g data-slot="leg-r"><rect x="108" y="244" width="16" height="140" rx="8" fill="var(--leg)"/></g>
  <!-- arms: upper arm (shoulder pivot) and forearm + hand (elbow pivot) -->
  <g data-slot="upper-l"><rect x="55" y="142" width="14" height="58" rx="7" fill="var(--skin)"/></g>
  <g data-slot="fore-l">
    <rect x="55.5" y="190" width="13" height="48" rx="6.5" fill="var(--skin)"/>
    <circle cx="62" cy="242" r="8.5" fill="var(--skin)"/>
  </g>
  <g data-slot="upper-r"><rect x="131" y="142" width="14" height="58" rx="7" fill="var(--skin)"/></g>
  <g data-slot="fore-r">
    <rect x="131.5" y="190" width="13" height="48" rx="6.5" fill="var(--skin)"/>
    <circle cx="138" cy="242" r="8.5" fill="var(--skin)"/>
  </g>
  <!-- the hand alone, used with long sleeves (the sleeve hides the arm) -->
  <g data-slot="hand-l"><circle cx="62" cy="242" r="8.5" fill="var(--skin)"/></g>
  <g data-slot="hand-r"><circle cx="138" cy="242" r="8.5" fill="var(--skin)"/></g>
</svg>
