<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Head coverings and accessories (catalog enums). data-place says where the builder puts each one:
       head (over the hair), torso (on the chest), back (behind the body), neck (over the torso), wrist (left forearm). -->
  <g data-covering="hijab" data-place="head">
    <path fill-rule="evenodd" d="M57 88 Q55 29 100 29 Q145 29 143 88 L147 134 Q147 152 128 157 L72 157 Q53 152 53 134 Z M74 84 A27 33 0 1 0 128 84 A27 33 0 1 0 74 84 Z" fill="var(--top-d)"/>
    <path d="M118 31 Q143 38 143 88 L147 134 Q147 152 128 157 L120 157 Q138 120 128 60 Q125 42 118 31 Z" fill="var(--ink)" opacity="0.18"/>
  </g>
  <g data-covering="cap" data-place="head">
    <path d="M65 64 Q65 33 100 33 Q135 33 135 64 Z" fill="var(--c-support)"/>
    <path d="M117 58 Q150 55 157 64 Q141 70 117 66 Z" fill="var(--c-support-d)"/>
  </g>
  <g data-covering="kufi" data-place="head">
    <path d="M69 56 Q71 31 100 30 Q129 31 131 56 Q100 49 69 56 Z" fill="var(--paper)"/>
    <path d="M70 52 Q100 45 130 52" fill="none" stroke="var(--c-neutral-1)" stroke-width="2.4"/>
  </g>
  <g data-accessory="glasses_round" data-place="head">
    <path d="M96 82 Q102 79 108 82" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="89" cy="82" r="7.5" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="115" cy="82" r="7.5" fill="none" stroke="var(--ink)" stroke-width="2"/>
  </g>
  <g data-accessory="glasses_square" data-place="head">
    <path d="M96 82 Q102 79 108 82" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <rect x="81" y="76" width="16" height="12" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <rect x="107" y="76" width="16" height="12" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/>
  </g>
  <g data-accessory="cap" data-place="head">
    <path d="M65 64 Q65 33 100 33 Q135 33 135 64 Z" fill="var(--c-support)"/>
    <path d="M117 58 Q150 55 157 64 Q141 70 117 66 Z" fill="var(--c-support-d)"/>
  </g>
  <g data-accessory="headband" data-place="head">
    <path d="M66 66 Q100 38 134 66 L132 73 Q100 47 68 73 Z" fill="var(--c-primary)"/>
  </g>
  <g data-accessory="backpack" data-place="back">
    <rect x="58" y="146" width="84" height="92" rx="16" fill="var(--c-secondary-d)"/>
  </g>
  <g data-accessory="backpack" data-place="torso">
    <rect x="73" y="133" width="8" height="74" rx="4" fill="var(--c-secondary)"/>
    <rect x="119" y="133" width="8" height="74" rx="4" fill="var(--c-secondary-d)"/>
  </g>
  <g data-accessory="scarf" data-place="neck">
    <path d="M79 127 Q100 142 121 127 L123 138 Q100 153 77 138 Z" fill="var(--c-primary)"/>
    <rect x="104" y="137" width="12" height="36" rx="5" fill="var(--c-primary-d)"/>
  </g>
  <g data-accessory="watch" data-place="wrist">
    <rect x="53.5" y="226" width="17" height="7" rx="3" fill="var(--ink)"/>
    <circle cx="62" cy="229.5" r="2.6" fill="var(--c-accent)"/>
  </g>
</svg>
