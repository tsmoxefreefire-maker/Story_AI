[project]
name = "story-service"
version = "0.1.0"
description = "Interactive Lesson Stories service: one lesson topic in, one short narrated interactive story out."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "tenacity>=8.2,<10",
  "playwright>=1.44,<2",
  "lxml>=5,<7",
  "fonttools[woff]>=4.50,<5",
  "brotli>=1.1,<2",
  "pyyaml>=6,<7",
  "html5lib>=1.1,<2",
  "jsonschema>=4.21,<5",
  "pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.4,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
story_service = ["assets/**/*", "runtime/*", "pipeline/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "integration: needs Chromium (Playwright) and ffmpeg",
  "e2e: the whole pipeline with fakes",
  "live: real providers and keys, run by hand",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["spec"]  # the engineer's spec files, kept exactly as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B905", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["story_service", "golden"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/local_shims/*" = ["B", "SIM"]
"src/story_service/assets/widgets/__init__.py" = ["E501"]   # SVG markup in f-strings reads better on one line
"src/story_service/validators/render.py" = ["E501"]          # JavaScript run in the page, kept on one line
"src/story_service/validators/interaction.py" = ["E501"]
